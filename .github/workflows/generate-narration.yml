name: Generate Narration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "metadata.js"
      - "scripts/generate_narration.py"
      - ".github/workflows/generate-narration.yml"

permissions:
  contents: write

jobs:
  build-narration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install edge-tts

      - name: Generate narration MP3
        run: |
          python scripts/generate_narration.py
          test -f assets/narration.mp3

      - name: Commit generated narration
        run: |
          if [ -z "$(git status --porcelain -- assets/narration.mp3)" ]; then
            echo "No narration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/narration.mp3
          git commit -m "chore: regenerate narration audio [skip ci]"
          git push
