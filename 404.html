<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function redirectToIndex() {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        // Support root hosting and common GitHub Pages-style subpath hosting.
        var segments = path.split("/").filter(Boolean);
        var knownAppFolder = "birthday_wish";
        var knownFolderIndex = segments.indexOf(knownAppFolder);
        var basePath = knownFolderIndex >= 0 ? "/" + segments.slice(0, knownFolderIndex + 1).join("/") + "/" : "/";
        var trailingSegments = knownFolderIndex >= 0 ? segments.slice(knownFolderIndex + 1) : segments.slice();
        var guessedSlug = trailingSegments.length ? trailingSegments[trailingSegments.length - 1] : "";
        var indexPath = basePath + "index.html";
        var params = new URLSearchParams(search);
        var validSlug = /^[a-z0-9-]+$/.test(guessedSlug);
        if (!params.get("p") && validSlug && guessedSlug !== "index" && guessedSlug !== "index.html" && guessedSlug !== "404" && guessedSlug !== "404.html") {
          params.set("p", guessedSlug);
        }
        var query = params.toString();
        var targetUrl = window.location.origin + indexPath + (query ? "?" + query : "") + hash;

        if (window.location.pathname !== indexPath) {
          window.location.replace(targetUrl);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the main app...</p>
    <noscript>
      <p>
        JavaScript is required. Open
        <a href="./index.html">index.html</a>.
      </p>
    </noscript>
  </body>
</html>
